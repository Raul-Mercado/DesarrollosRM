<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    /* Real Genesis Pro palette — sampled from the app screenshots */
    --bg: #0d1421;              /* page background — deep navy */
    --bg-2: #0f1a2e;            /* slightly raised */
    --surface: #16243d;         /* cards / panels */
    --surface-2: #1d2f4d;       /* hover / nested */
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.16);

    --ink: #f6f9ff;             /* primary text */
    --ink-2: #c9d5e8;            /* secondary text */
    --ink-3: #8094b4;            /* tertiary text */

    --brand: #2D7CE6;            /* the program's blue */
    --brand-2: #4a93f0;           /* hover */
    --brand-deep: #1e4d7b;        /* the dark blue from the logo */
    --brand-soft: #6da7f3;

    --ok: #22c47a;               /* green "Iniciar" */
    --ok-deep: #169856;
    --danger: #e85a4f;            /* red "Terminar" */
    --warn: #ffb84d;              /* yellow status */
    --gold: #ffb84d;
  }
  *,*::before,*::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink-2);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  /* faint blueprint grid */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none; z-index: 0;
    mask-image: radial-gradient(ellipse at top, black 30%, transparent 80%);
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 1200px 600px at 20% -10%, rgba(45,124,230,0.18), transparent 60%),
      radial-gradient(ellipse 800px 500px at 90% 10%, rgba(30,77,123,0.18), transparent 60%);
    pointer-events: none; z-index: 0;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .serif-i { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  img { max-width: 100%; display: block; }

  /* Container */
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 48px; position: relative; z-index: 1; }

  /* ============ NAV ============ */
  .nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(13, 20, 33, 0.72);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    height: 76px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-mark {
    width: 40px; height: 40px;
    background: white;
    border-radius: 9px;
    display: grid; place-items: center;
    box-shadow: 0 2px 0 rgba(255,255,255,0.08) inset, 0 8px 24px rgba(45,124,230,0.18);
  }
  .brand-text-wrap { display: flex; flex-direction: column; gap: 2px; }
  .brand-text {
    font-weight: 800; font-size: 17px; letter-spacing: 0.04em;
    color: var(--ink);
    line-height: 1;
  }
  .brand-text .pipe { color: var(--brand); margin: 0 2px; font-weight: 500; }
  .brand-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-3);
  }
  .nav-links { display: flex; gap: 36px; }
  .nav-links a {
    font-size: 14px; font-weight: 500; color: var(--ink-2);
    position: relative; padding: 6px 0;
    transition: color 0.18s ease;
  }
  .nav-links a:hover { color: var(--ink); }
  .nav-links a::after {
    content: ''; position: absolute; left: 0; bottom: 0;
    width: 0; height: 1px; background: var(--brand);
    transition: width 0.2s ease;
  }
  .nav-links a:hover::after { width: 100%; }
  .nav-cta {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--brand); color: white;
    padding: 11px 20px; font-size: 13px; font-weight: 600;
    letter-spacing: 0.01em;
    border-radius: 8px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.2) inset, 0 6px 16px rgba(45,124,230,0.32);
    transition: all 0.18s ease;
  }
  .nav-cta:hover { background: var(--brand-2); transform: translateY(-1px); }
  .nav-cta svg { width: 15px; height: 15px; }

  /* ============ HERO ============ */
  .hero {
    position: relative;
    padding: 96px 0 80px;
    overflow: hidden;
  }
  .hero-tag {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--brand-soft); margin-bottom: 28px;
    padding: 6px 14px;
    border: 1px solid rgba(45,124,230,0.32);
    border-radius: 999px;
    background: rgba(45,124,230,0.08);
  }
  .hero-tag .dot { width: 6px; height: 6px; background: var(--brand); border-radius: 50%; box-shadow: 0 0 12px var(--brand); animation: dotpulse 2s ease-in-out infinite; }
  @keyframes dotpulse { 50% { opacity: 0.4; } }

  .hero-h1 {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: clamp(48px, 7vw, 96px);
    line-height: 0.94;
    letter-spacing: -0.035em;
    color: var(--ink);
    margin: 0 0 28px;
    text-align: center;
    max-width: 1100px; margin-left: auto; margin-right: auto;
  }
  .hero-h1 .i {
    font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400;
    color: var(--brand-soft);
    letter-spacing: -0.02em;
  }
  .hero-lead {
    font-size: 19px; line-height: 1.55;
    color: var(--ink-2); max-width: 680px;
    margin: 0 auto 40px;
    text-align: center;
  }
  .hero-ctas {
    display: flex; gap: 14px; align-items: center; justify-content: center;
    margin-bottom: 28px;
  }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 12px;
    background: var(--brand); color: white;
    padding: 16px 28px; font-size: 15px; font-weight: 700;
    letter-spacing: 0.01em;
    border-radius: 10px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.2) inset, 0 12px 28px rgba(45,124,230,0.32);
    transition: all 0.18s ease;
  }
  .btn-primary:hover { background: var(--brand-2); transform: translateY(-1px); box-shadow: 0 1px 0 rgba(255,255,255,0.2) inset, 0 16px 36px rgba(45,124,230,0.4); }
  .btn-primary svg.win { width: 18px; height: 18px; }
  .btn-primary .meta { font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.75; font-weight: 500; }
  .btn-ghost {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--ink); padding: 16px 22px;
    font-size: 14px; font-weight: 600;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    transition: all 0.18s ease;
    background: rgba(255,255,255,0.02);
  }
  .btn-ghost:hover { border-color: var(--brand); background: rgba(45,124,230,0.08); }

  .hero-trust {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-3); margin-bottom: 64px;
  }
  .hero-trust .sep { color: var(--brand); margin: 0 10px; }

  /* Hero hero — the dashboard screenshot */
  .hero-shot {
    position: relative;
    max-width: 1180px; margin: 0 auto;
    border-radius: 14px;
    overflow: hidden;
    box-shadow:
      0 60px 120px -20px rgba(0,0,0,0.6),
      0 30px 60px -10px rgba(0,0,0,0.4),
      0 0 0 1px rgba(255,255,255,0.08);
    background: var(--surface);
    transform: perspective(2400px) rotateX(2deg);
  }
  .hero-shot::before {
    content: '';
    position: absolute; inset: -2px;
    border-radius: 14px;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(45,124,230,0.4), transparent 30%);
    mix-blend-mode: screen;
    opacity: 0.6;
  }
  .hero-shot img { width: 100%; display: block; }
  .hero-shot .badge {
    position: absolute; top: 16px; right: 16px; z-index: 3;
    background: rgba(13,20,33,0.85);
    backdrop-filter: blur(8px);
    border: 1px solid var(--line-strong);
    padding: 6px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--brand-soft);
    border-radius: 6px;
  }
  .hero-corners {
    position: absolute; left: -32px; right: -32px; top: -32px; bottom: -32px;
    pointer-events: none;
  }
  .hero-corners::before, .hero-corners::after,
  .hc-bl, .hc-br {
    content: ''; position: absolute; width: 18px; height: 18px;
    border: 1.5px solid var(--brand);
  }
  .hero-corners::before { top: 0; left: 0; border-right: none; border-bottom: none; }
  .hero-corners::after  { top: 0; right: 0; border-left: none; border-bottom: none; }
  .hc-bl { bottom: 0; left: 0; border-right: none; border-top: none; }
  .hc-br { bottom: 0; right: 0; border-left: none; border-top: none; }

  /* ============ STATS STRIP ============ */
  .stats {
    margin-top: 100px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 36px 0;
  }
  .stats-inner {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 32px;
  }
  .stat .v {
    font-family: 'Manrope', sans-serif;
    font-weight: 800; font-size: 36px;
    color: var(--ink); letter-spacing: -0.02em;
    line-height: 1;
  }
  .stat .v .u { color: var(--brand); font-size: 20px; font-weight: 600; margin-left: 4px; }
  .stat .l {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.16em; color: var(--ink-3);
    margin-top: 12px;
  }

  /* ============ SECTION HEADERS ============ */
  .section { padding: 130px 0; position: relative; }
  .section-eyebrow {
    display: inline-flex; align-items: center; gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--brand-soft);
  }
  .section-eyebrow .id { color: var(--ink-3); }
  .section-eyebrow::before {
    content: ''; width: 28px; height: 1px; background: var(--brand);
  }
  .section-title {
    font-family: 'Manrope', sans-serif;
    font-weight: 800; font-size: clamp(40px, 5vw, 64px);
    line-height: 1; letter-spacing: -0.028em;
    color: var(--ink);
    margin: 22px 0 24px;
    max-width: 900px;
  }
  .section-title .i { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; color: var(--brand-soft); }
  .section-desc {
    font-size: 18px; line-height: 1.55; color: var(--ink-2);
    max-width: 640px;
  }
  .section-head-row {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 48px; margin-bottom: 56px;
  }
  .section-head-row .right { flex-shrink: 0; max-width: 360px; }

  /* ============ FEATURES (sidebar mirrored) ============ */
  .feat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  .feat {
    position: relative;
    background: linear-gradient(180deg, var(--surface) 0%, var(--bg-2) 100%);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px 24px 26px;
    transition: all 0.2s ease;
    overflow: hidden;
  }
  .feat:hover {
    border-color: rgba(45,124,230,0.4);
    transform: translateY(-2px);
    box-shadow: 0 16px 32px -8px rgba(0,0,0,0.4);
  }
  .feat::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(400px 200px at 0% 0%, rgba(45,124,230,0.1), transparent);
    opacity: 0; transition: opacity 0.2s ease;
    pointer-events: none;
  }
  .feat:hover::after { opacity: 1; }
  .feat-icon {
    width: 42px; height: 42px;
    display: grid; place-items: center;
    color: var(--brand-soft);
    background: rgba(45,124,230,0.12);
    border: 1px solid rgba(45,124,230,0.22);
    border-radius: 10px;
    margin-bottom: 20px;
  }
  .feat h3 {
    font-size: 17px; font-weight: 700;
    color: var(--ink);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .feat p {
    font-size: 13.5px; line-height: 1.55;
    color: var(--ink-3);
    margin: 0;
  }
  .feat-tag {
    position: absolute; top: 22px; right: 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 0.16em;
    color: var(--ink-3);
  }

  /* ============ DUAL THEME SHOWCASE ============ */
  .theme-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 24px; margin-top: 64px;
  }
  .theme-card {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: var(--surface);
  }
  .theme-card img { width: 100%; display: block; }
  .theme-label {
    position: absolute; top: 14px; left: 14px;
    display: flex; align-items: center; gap: 8px;
    background: rgba(13,20,33,0.85);
    backdrop-filter: blur(8px);
    border: 1px solid var(--line-strong);
    padding: 6px 12px 6px 8px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink);
  }
  .theme-label .swatch {
    width: 16px; height: 16px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .theme-foot {
    display: flex; justify-content: space-between;
    margin-top: 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-3);
  }

  /* ============ TIMER FOCUS ROW ============ */
  .focus-row {
    display: grid; grid-template-columns: 1.05fr 1fr;
    gap: 64px; align-items: center;
    margin-top: 64px;
  }
  .focus-row.reverse { grid-template-columns: 1fr 1.05fr; }
  .focus-row.reverse > .focus-text { order: 2; }
  .focus-row.reverse > .focus-vis { order: 1; }
  .focus-text h3 {
    font-family: 'Manrope', sans-serif;
    font-weight: 800; font-size: 40px;
    line-height: 1.05; letter-spacing: -0.02em;
    color: var(--ink);
    margin: 14px 0 18px;
  }
  .focus-text h3 .i { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; color: var(--brand-soft); }
  .focus-text p {
    font-size: 16px; line-height: 1.6;
    color: var(--ink-2); margin: 0 0 24px;
  }
  .focus-list {
    list-style: none; padding: 0; margin: 24px 0 0;
    display: flex; flex-direction: column; gap: 10px;
  }
  .focus-list li {
    display: flex; align-items: flex-start; gap: 12px;
    font-size: 14.5px; color: var(--ink-2);
    line-height: 1.5;
  }
  .focus-list li::before {
    content: ''; width: 6px; height: 6px;
    background: var(--brand); border-radius: 50%;
    margin-top: 8px; flex-shrink: 0;
    box-shadow: 0 0 8px var(--brand);
  }
  .focus-vis {
    position: relative;
    border-radius: 14px; overflow: hidden;
    border: 1px solid var(--line);
    background: var(--surface);
    box-shadow: 0 24px 60px -12px rgba(0,0,0,0.5);
  }
  .focus-vis img { width: 100%; display: block; }

  /* ============ EXPORT FORMATS ============ */
  .export-section { padding: 130px 0; }
  .export-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 18px; margin-top: 56px;
  }
  .fmt-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px;
    position: relative;
    transition: all 0.2s ease;
  }
  .fmt-card:hover { border-color: rgba(45,124,230,0.4); transform: translateY(-2px); }
  .fmt-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 10px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
    margin-bottom: 18px;
  }
  .fmt-badge.pdf  { background: rgba(232,90,79,0.12); color: #ff8a82; border: 1px solid rgba(232,90,79,0.25); }
  .fmt-badge.xls  { background: rgba(34,196,122,0.12); color: #4fde9e; border: 1px solid rgba(34,196,122,0.25); }
  .fmt-badge.txt  { background: rgba(255,184,77,0.12); color: var(--gold); border: 1px solid rgba(255,184,77,0.25); }
  .fmt-card h3 {
    font-size: 22px; font-weight: 700; color: var(--ink);
    margin: 0 0 8px; letter-spacing: -0.01em;
  }
  .fmt-card p {
    font-size: 14px; line-height: 1.5; color: var(--ink-3); margin: 0 0 18px;
  }
  .fmt-preview {
    height: 110px;
    background: rgba(255,255,255,0.02);
    border: 1px dashed rgba(255,255,255,0.1);
    border-radius: 8px;
    display: grid; place-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-3);
    padding: 12px;
    line-height: 1.5;
    overflow: hidden;
  }
  .fmt-preview pre { margin: 0; font-size: 9px; color: var(--ink-3); white-space: pre; }
  .fmt-preview.pdf {
    background: white; color: #333;
    background-image: linear-gradient(180deg, rgba(255,255,255,1) 0%, rgba(245,245,245,1) 100%);
  }
  .fmt-preview.pdf pre { color: #1a1a1a; font-size: 8px; }
  .fmt-preview.xls {
    background: #f3faf6; color: #1a1a1a;
  }
  .fmt-preview.xls pre { color: #14693e; font-size: 9px; }
  .pdf-bar {
    display: flex; justify-content: space-between;
    background: #d44a3e; color: white;
    padding: 4px 8px; font-family: 'JetBrains Mono', monospace;
    font-size: 8px; letter-spacing: 0.1em;
    margin-bottom: 8px;
    border-radius: 3px;
  }

  /* ============ PROGRAMA REAL — SCREENSHOTS GALLERY ============ */
  .gallery-section { padding: 130px 0; background: linear-gradient(180deg, transparent 0%, rgba(45,124,230,0.04) 50%, transparent 100%); }
  .gallery-tabs {
    display: flex; gap: 6px; margin-top: 32px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .gtab {
    padding: 14px 20px; font-size: 13px; font-weight: 600;
    color: var(--ink-3);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    cursor: pointer;
    transition: all 0.16s ease;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .gtab svg { width: 14px; height: 14px; }

  .counter-card {

    padding: 48px 80px;
    background:
      radial-gradient(ellipse 600px 300px at 50% 0%, rgba(45,124,230,0.18), transparent 60%),

    border: 1px solid rgba(45,124,230,0.25);
    border-radius: 18px;

      0 30px 60px -20px rgba(0,0,0,0.5),

  .counter-card::before, .counter-card::after,
  .cc-bl, .cc-br {

  .counter-card::after  { top: 14px; right: 14px; border-left: none; border-bottom: none; }

  .counter-foot {

  .dedication .eye {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;

    font-size: 18px; line-height: 1.55;
    color: var(--ink-2);

    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink-3);

  @media (max-width: 980px) {

    .hero-lead { font-size: 15px; }
    .section-title { font-size: clamp(26px, 7vw, 40px) !important; }

    /* CTAs en columna y a todo el ancho */
    .hero-ctas { flex-direction: column; align-items: stretch; }
    .hero-ctas a { justify-content: center; }
    .download-actions { flex-direction: column; align-items: stretch; }
    .download-actions a { justify-content: center; text-align: center; }

    /* Imágenes: que nunca se corten ni desborden */
    .hero-shot, .gallery-shot, .focus-vis, .feat-card { max-width: 100%; }
    .hero-shot img, .gallery-shot img, .focus-vis img { width: 100%; height: auto; object-fit: contain; }

    .gallery-tabs { flex-wrap: wrap; gap: 8px; }

    /* Stats: 2 columnas en vez de 4 apretadas */
    .stats-inner { grid-template-columns: 1fr 1fr; gap: 20px; }

    /* Reducir títulos grandes de secciones especiales */
    .download h2, .cta h2 { font-size: clamp(28px, 8vw, 44px) !important; }
  }

  body.is-light {

  }
  body.is-light::after {
    background:

  body.is-light .fmt-card {

  }
  body.is-light .wstep { background: white; }
  body.is-light footer { background: var(--bg-2); }

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

// =========== DOWNLOAD COUNTER (real, via abacus.jasoncameron.dev) ===========
// Free public counter API — no auth, no registration.
//  GET  https://abacus.jasoncameron.dev/get/<ns>/<key>      → { value: N }
//  GET  https://abacus.jasoncameron.dev/hit/<ns>/<key>      → increments + returns value
// We READ the count on page load (animated from 0) and BUMP on download click —
// with a localStorage guard so a single browser counts at most once.

const COUNTER_NS  = 'genesis-pro-rm';
const COUNTER_KEY = 'descargas-windows';
const COUNTER_API = 'https://abacus.jasoncameron.dev';

async function fetchDownloadCount() {
  try {
    const r = await fetch(`${COUNTER_API}/get/${COUNTER_NS}/${COUNTER_KEY}`);
    if (!r.ok) throw new Error('bad response');
    const j = await r.json();
    return Number(j.value || 0);
  } catch (e) {
    return null;
  }
}

async function bumpDownloadCount() {
  // Only bump once per browser/device
  const flag = 'gp_dl_bumped';
  if (localStorage.getItem(flag)) return null;
  try {
    const r = await fetch(`${COUNTER_API}/hit/${COUNTER_NS}/${COUNTER_KEY}`);
    if (!r.ok) throw new Error('bad response');
    const j = await r.json();
    localStorage.setItem(flag, '1');
    return Number(j.value || 0);
  } catch (e) {
    return null;
  }
}

// Animate a number from 0 → target with easing
function useCountUp(target, duration = 1600) {
  const [n, setN] = React.useState(0);
  React.useEffect(() => {
    if (target == null || target === 0) { setN(0); return; }
    const start = performance.now();
    let raf;
    const tick = (now) => {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3); // easeOutCubic
      setN(Math.floor(target * eased));
      if (t < 1) raf = requestAnimationFrame(tick);
      else setN(target);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return n;
}

const DownloadCounter = () => {
  const [count, setCount]   = React.useState(null);
  const [status, setStatus] = React.useState('loading'); // loading | live | offline
  const animated = useCountUp(count ?? 0);

  React.useEffect(() => {
    let alive = true;
    fetchDownloadCount().then(v => {
      if (!alive) return;
      if (v == null) { setStatus('offline'); setCount(0); }
      else           { setStatus('live');    setCount(v); }
    });
    // expose a global so the Download CTA can increment from anywhere
    window.__gpBumpDownload = async () => {
      const v = await bumpDownloadCount();
      if (v != null) setCount(v);
    };
    return () => { alive = false; };
  }, []);

  // pad to at least 6 digits with separators
  const display = String(animated).padStart(6, '0');
  // group into 3-3 (or however) with a thin space
  const groups = display.replace(/(\d{3})(?=\d)/g, '$1 ').split(' ');

  return (
    <section className="counter-section">
      <div className="wrap">
        <div className="counter-card">
          <span className="cc-bl"/><span className="cc-br"/>
          <div className="counter-eye">
            <span className="live-dot"/>
            {status === 'live' && <span>Contador en vivo · Descargas reales</span>}
            {status === 'loading' && <span>Sincronizando contador…</span>}
            {status === 'offline' && <span>Contador local · Sin conexión</span>}
          </div>
          <div className="counter-num" aria-label={`${animated} descargas`}>
            {groups.map((g, i) => (
              <React.Fragment key={i}>
                {i > 0 && <span style={{color:'var(--brand)', opacity:0.6, margin:'0 4px'}}>·</span>}
                <span className="grp">{g}</span>
              </React.Fragment>
            ))}
          </div>
          <div className="counter-label">
            descargas de <strong>GÉNESIS|PRO</strong> en Windows

// Genesis Pro — root app + tweaks

// Versión de respaldo si la API de GitHub no responde (sin conexión, límite de
// peticiones, etc). Mantené este número igual al último release publicado.
const FALLBACK_VERSION = '5.07';
const GITHUB_REPO = 'Raul-Mercado/DesarrollosRM';

// Lee la última versión publicada en GitHub Releases.
// Cuando subas un nuevo release, la página se actualiza sola sin tocar el HTML.
const useLatestVersion = () => {
  const [version, setVersion] = React.useState(FALLBACK_VERSION);
  React.useEffect(() => {
    let cancelled = false;
    fetch(`https://api.github.com/repos/${GITHUB_REPO}/releases/latest`)
      .then(r => (r.ok ? r.json() : Promise.reject(r.status)))
      .then(data => {
        if (cancelled || !data || !data.tag_name) return;
        // normaliza "v5.07", "V5.07", "5.07" -> "5.07"
        const clean = String(data.tag_name).replace(/^v/i, '').trim();
        if (clean) setVersion(clean);
      })
      .catch(() => { /* se queda con FALLBACK_VERSION */ });
    return () => { cancelled = true; };
  }, []);
  return version;
};

const DEFAULTS = /*EDITMODE-BEGIN*/{"mode":"dark","accent":"#2D7CE6"}/*EDITMODE-END*/;

const App = () => {
  const [t, setTweak] = useTweaks(DEFAULTS);
  const version = useLatestVersion();

  React.useEffect(() => {
    document.body.classList.toggle('is-light', t.mode === 'light');
  }, [t.mode]);

  React.useEffect(() => {
    const root = document.documentElement;
    // derive soft / deep / 2 from the accent
    const hex = t.accent || '#2D7CE6';
    const rgb = hex.replace('#','').match(/.{2}/g).map(h => parseInt(h,16));
    const mix = (a,b,p) => Math.round(a*(1-p) + b*p);
    const lighter = '#' + rgb.map(v => mix(v,255,0.32).toString(16).padStart(2,'0')).join('');
    const lightest = '#' + rgb.map(v => mix(v,255,0.55).toString(16).padStart(2,'0')).join('');
    const darker = '#' + rgb.map(v => mix(v,0,0.45).toString(16).padStart(2,'0')).join('');
    root.style.setProperty('--brand', hex);
    root.style.setProperty('--brand-2', lighter);
    root.style.setProperty('--brand-soft', lightest);
    root.style.setProperty('--brand-deep', darker);
  }, [t.accent]);

  return (
    <>
      <Nav version={version} />
      <Hero version={version} />
      <Stats version={version} />
      <Features />
      <FocusRows />
      <Themes />
      <Exports />
      <Gallery />
      <Workflow />
      <DownloadCounter />
      <Dedication />
      <Download version={version} />
      <Footer />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Tema" />
        <TweakRadio
          label="Modo"
          value={t.mode}
          options={[
            { value: 'dark',  label: 'Oscuro' },
            { value: 'light', label: 'Claro' },
          ]}
          onChange={(v) => setTweak('mode', v)}
        />
        <TweakColor
          label="Color de acento"
          value={t.accent}
          options={['#2D7CE6', '#1e4d7b', '#16a34a', '#9333ea', '#ea580c']}
          onChange={(v) => setTweak('accent', v)}
        />
      </TweaksPanel>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
